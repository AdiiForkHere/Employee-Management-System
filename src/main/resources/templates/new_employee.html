<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Employee</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Existing CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>

        body{
            font-family:'Poppins',sans-serif;
            background:#eef2ff;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .form-card{
            width:550px;
            background:white;
            padding:40px;
            border-radius:22px;
            box-shadow:0 20px 45px rgba(0,0,0,.08);
        }

        .title{
            text-align:center;
            margin-bottom:30px;
        }

        .title i{
            font-size:55px;
            color:#5B4BFF;
        }

        .title h2{
            margin-top:15px;
            font-weight:700;
        }

        .title p{
            color:gray;
        }

        .form-control{
            height:55px;
            border-radius:12px;
            margin-bottom:20px;
        }

        .btn-save{
            width:100%;
            height:55px;
            background:#5B4BFF;
            color:white;
            border:none;
            border-radius:12px;
            font-weight:600;
            transition:.3s;
        }

        .btn-save:hover{
            background:#4838f5;
        }

        .back-btn{
            margin-bottom:25px;
        }

    </style>

</head>

<body>

<div class="form-card">

    <a th:href="@{/employees}" class="btn btn-outline-primary back-btn">

        <i class="bi bi-arrow-left"></i>

        Back to Dashboard

    </a>

    <div class="title">

        <i class="bi bi-person-plus-fill"></i>

        <h2>Add Employee</h2>

        <p>Fill all employee details below</p>

    </div>

    <form th:action="@{/employees}"
          th:object="${employee}"
          method="post">

        <div class="mb-3">

            <label class="form-label">

                First Name

            </label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{firstName}"
                    placeholder="Enter First Name">

        </div>

        <div class="mb-3">

            <label class="form-label">

                Last Name

            </label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{lastName}"
                    placeholder="Enter Last Name">

        </div>

        <div class="mb-4">

            <label class="form-label">

                Email Address

            </label>

            <input
                    type="email"
                    class="form-control"
                    th:field="*{email}"
                    placeholder="Enter Email Address">

        </div>

        <button
                type="submit"
                class="btn-save">

            <i class="bi bi-check-circle-fill"></i>

            Save Employee

        </button>

    </form>

</div>

</body>

</html>
