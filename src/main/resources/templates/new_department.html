<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Department</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #EEF2FF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .card {
            width: 800px;
            border: none;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, .08);
        }

        h2 {
            text-align: center;
            font-weight: 700;
            color: #5B4BFF;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: gray;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            height: 48px;
        }

        .btn-save {
            width: 100%;
            background: #5B4BFF;
            color: white;
            height: 52px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-save:hover {
            background: #4338CA;
        }
    </style>

</head>

<body>

    <div class="card">

        <a th:href="@{/employees}" class="btn btn-outline-primary mb-4">
            <i class="bi bi-arrow-left"></i>

            Back to Dashboard

        </a>

        <h2>Add Department</h2>

        <p>Fill all department details</p>

        <form th:action="@{/departments}" th:object="${department}" method="post">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Department Name</label>
                    <input type="text" class="form-control" th:field="*{departmentName}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Department Code</label>
                    <input type="text" class="form-control" th:field="*{departmentCode}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Manager Name</label>
                    <input type="text" class="form-control" th:field="*{managerName}" required>
                </div>

                <div class="col-md-12 mb-4">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="4" th:field="*{description}" style="height:auto;"></textarea>
                </div>

            </div>

            <button type="submit" class="btn-save">

                <i class="bi bi-check-circle-fill"></i>

                Save Employee

            </button>

        </form>

    </div>

</body>

</html>
